  <script type="text/babel" data-presets="react">
// components.jsx — shared UI primitives for the Chardchakaj app
// iOS 26 liquid-glass aesthetic. All components write to window so the
// per-screen babel files can pick them up without imports.

const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;

// ──────────────────────────────────────────────────────────────
// Tokens
// ──────────────────────────────────────────────────────────────
const TC = {
  bg:       '#EFEBE2',       // warm eggshell page bg
  bg2:      '#F6F3EB',       // lighter
  card:     '#FFFFFF',
  ink:      '#1B1A17',
  ink2:     '#3F3D38',
  muted:    '#7A7770',
  hair:     'rgba(27,26,23,0.08)',
  hairLite: 'rgba(27,26,23,0.05)',
  green:    '#1F8A5B',
  greenDk:  '#0E5A3B',
  greenSoft:'#E5F1EA',
  amber:    '#D4A24C',
  amberSoft:'#FAF0DC',
  rose:     '#D4456C',
  roseSoft: '#FBE6EC',
  sky:      '#4F8DD6',
  skySoft:  '#E4EEF9',
  plum:     '#7A5AE0',
  plumSoft: '#EBE5FB',
  orange:   '#E26A4A',
  orangeSoft:'#FBE7DF',
};
window.TC = TC;

// Density: 'compact' | 'comfy'
const DensityCtx = createContext('comfy');
const useDensity = () => useContext(DensityCtx);
window.DensityCtx = DensityCtx; window.useDensity = useDensity;

// ──────────────────────────────────────────────────────────────
// Glass surface — translucent panel with backdrop blur + shine
// ──────────────────────────────────────────────────────────────
function Glass({ children, style = {}, tint = 'rgba(255,255,255,0.62)', radius = 28, shine = true, border = true, blur = 28 }) {
  return (
    <div style={{ position: 'relative', borderRadius: radius, ...style }}>
      <div style={{
        position: 'absolute', inset: 0, borderRadius: radius,
        background: tint,
        backdropFilter: `blur(${blur}px) saturate(180%)`,
        WebkitBackdropFilter: `blur(${blur}px) saturate(180%)`,
        boxShadow: shine
          ? 'inset 0 1px 0 rgba(255,255,255,0.85), inset 0 -1px 0 rgba(0,0,0,0.04)'
          : 'inset 0 1px 0 rgba(255,255,255,0.5)',
        border: border ? '0.5px solid rgba(255,255,255,0.55)' : 'none',
      }} />
      <div style={{ position: 'relative', zIndex: 1 }}>{children}</div>
    </div>
  );
}
window.Glass = Glass;

// ──────────────────────────────────────────────────────────────
// Card — solid card with concentric corners + soft shadow
// ──────────────────────────────────────────────────────────────
function Card({ children, style = {}, radius = 24, pad, onClick }) {
  const d = useDensity();
  const padding = pad ?? (d === 'compact' ? 12 : 16);
  return (
    <div onClick={onClick} style={{
      background: TC.card, borderRadius: radius, padding,
      boxShadow: '0 1px 0 rgba(255,255,255,1) inset, 0 1px 2px rgba(27,26,23,0.05), 0 6px 22px rgba(27,26,23,0.06)',
      ...style,
    }}>{children}</div>
  );
}
window.Card = Card;

// ──────────────────────────────────────────────────────────────
// Status tag — vibrant tint pill
// ──────────────────────────────────────────────────────────────
const STATUS = {
  done:   { label: 'Done',     bg: TC.greenSoft,  fg: TC.greenDk },
  doing:  { label: 'In progress', bg: TC.skySoft,  fg: '#1B4F87' },
  review: { label: 'In review', bg: TC.amberSoft, fg: '#7A5A12' },
  todo:   { label: 'To do',    bg: '#F0EDE3',     fg: TC.ink2 },
  next:   { label: 'Next up',  bg: TC.plumSoft,   fg: '#3F2A8C' },
  queue:  { label: 'Queued',   bg: '#EFECE3',     fg: TC.muted },
  blocked:{ label: 'Blocked',  bg: TC.roseSoft,   fg: '#8C1F3A' },
  out:    { label: 'Checked out', bg: TC.skySoft, fg: '#1B4F87' },
  in:     { label: 'Available', bg: TC.greenSoft, fg: TC.greenDk },
  maint:  { label: 'In service', bg: TC.amberSoft, fg: '#7A5A12' },
};
window.STATUS = STATUS;

function Tag({ kind = 'todo', children, sm = false }) {
  const cfg = STATUS[kind] || STATUS.todo;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      background: cfg.bg, color: cfg.fg,
      padding: sm ? '2px 8px' : '4px 10px',
      fontSize: sm ? 10.5 : 11.5, fontWeight: 600,
      borderRadius: 999, letterSpacing: 0.1,
      textTransform: 'uppercase',
    }}>{children || cfg.label}</span>
  );
}
window.Tag = Tag;

// ──────────────────────────────────────────────────────────────
// Avatar — initials chip with role tint
// ──────────────────────────────────────────────────────────────
function Avatar({ user, size = 32, ring = false }) {
  if (!user) return null;
  return (
    <div style={{
      width: size, height: size, borderRadius: 999,
      background: user.tint, color: '#fff',
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      fontWeight: 700, fontSize: size * 0.4, letterSpacing: 0.2,
      boxShadow: ring ? `0 0 0 2px ${TC.card}, 0 0 0 3.5px ${user.tint}` : '0 0 0 1.5px rgba(255,255,255,0.9)',
      flexShrink: 0, fontFamily: '-apple-system, system-ui',
    }}>{user.short}</div>
  );
}
window.Avatar = Avatar;

function userById(id) { return (window.APP_DATA.team || []).find(u => u.id === id); }
window.userById = userById;

// Avatar stack
function AvatarStack({ ids = [], max = 4, size = 24 }) {
  const list = ids.slice(0, max).map(userById).filter(Boolean);
  const extra = ids.length - list.length;
  return (
    <div style={{ display: 'inline-flex' }}>
      {list.map((u, i) => (
        <div key={u.id} style={{ marginLeft: i === 0 ? 0 : -size * 0.32 }}>
          <Avatar user={u} size={size} />
        </div>
      ))}
      {extra > 0 && (
        <div style={{
          marginLeft: -size * 0.32, width: size, height: size, borderRadius: 999,
          background: '#E8E4D9', color: TC.ink2, fontSize: size * 0.38, fontWeight: 700,
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: '0 0 0 1.5px rgba(255,255,255,0.9)',
        }}>+{extra}</div>
      )}
    </div>
  );
}
window.AvatarStack = AvatarStack;

// ──────────────────────────────────────────────────────────────
// Progress circle (SVG, concentric)
// ──────────────────────────────────────────────────────────────
function Ring({ pct = 0, size = 48, stroke = 5, color = TC.green, track = 'rgba(27,26,23,0.08)', children }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c - (pct / 100) * c;
  return (
    <div style={{ position: 'relative', width: size, height: size, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} stroke={track} strokeWidth={stroke} fill="none" />
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
                strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
                style={{ transition: 'stroke-dashoffset 600ms cubic-bezier(.4,.0,.2,1)' }} />
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: size * 0.28, color: TC.ink }}>
        {children}
      </div>
    </div>
  );
}
window.Ring = Ring;

// Linear progress
function Bar({ pct = 0, color = TC.green, height = 6 }) {
  return (
    <div style={{ height, borderRadius: 999, background: 'rgba(27,26,23,0.07)', overflow: 'hidden' }}>
      <div style={{
        width: `${pct}%`, height: '100%', background: color, borderRadius: 999,
        transition: 'width 600ms cubic-bezier(.4,.0,.2,1)',
      }} />
    </div>
  );
}
window.Bar = Bar;

// ──────────────────────────────────────────────────────────────
// Icons (24px, currentColor)
// ──────────────────────────────────────────────────────────────
const I = {
  home:     <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 11l8-6 8 6v8a2 2 0 01-2 2h-3v-6h-6v6H6a2 2 0 01-2-2v-8z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/></svg>,
  folder:   <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/></svg>,
  inbox:    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 13l3-8h12l3 8M3 13v5a2 2 0 002 2h14a2 2 0 002-2v-5M3 13h5l1.5 2h5L16 13h5" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round"/></svg>,
  tools:    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M14.5 6.5l3 3M3 21l4-1 11-11-3-3L4 17l-1 4zM17 4l3 3" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round"/></svg>,

function Pill({ children, kind = 'soft', onClick, color, icon, style = {} }) {

    primary:{ bg: TC.green, fg: '#fff' },
    dark:   { bg: TC.ink,  fg: '#fff' },
    glass:  { bg: 'rgba(255,255,255,0.7)', fg: TC.ink, border: '0.5px solid rgba(255,255,255,0.8)' },
  };
  const p = palettes[kind] || palettes.soft;
  return (
    <button onClick={onClick} style={{
      display:'inline-flex', alignItems:'center', gap: 6,
      padding: '8px 14px', borderRadius: 999, border: p.border || 'none',
      background: color ? color : p.bg, color: p.fg,
      font:'inherit', fontSize: 13, fontWeight: 600, cursor:'pointer',

  const allTabs = [
    { k: 'home',     i: I.home,   l: 'Home' },
    { k: 'projects', i: I.folder, l: 'Projects' },
    { k: 'tools',    i: I.tools,  l: 'Tools' },
    { k: 'inbox',    i: I.inbox,  l: 'Inbox' },
  ];
  // Founder: no Tools (no creation needed)
  const tabs = role?.isBoss ? allTabs.filter(t => t.k !== 'tools') : allTabs;
  const showAdd = !role?.isBoss;
  return (
    <div style={{
      position:'absolute', left: 0, right: 0, bottom: 22,
      display:'flex', justifyContent:'center', gap: 10,
      padding: '0 14px', zIndex: 40, pointerEvents: 'none',
    }}>
      <Glass radius={32} style={{ flex: 1, pointerEvents:'auto' }}>
        <div style={{ display:'flex', justifyContent:'space-around', padding: '8px 6px' }}>
          {tabs.map(t => {
            const on = active === t.k;
            return (
              <button key={t.k} onClick={() => onChange(t.k)} style={{
                background:'none', border:'none', padding: '6px 10px',
                display:'flex', flexDirection:'column', alignItems:'center', gap: 2,
                color: on ? TC.green : TC.ink2, cursor:'pointer',
              }}>
                {t.i}
                <span style={{ fontSize: 10.5, fontWeight: 600 }}>{t.l}</span>
              </button>
            );
          })}
        </div>
      </Glass>
      {showAdd && (
        <Glass radius={32} style={{ pointerEvents:'auto' }}>
          <button onClick={onAdd} style={{
            background:'none', border:'none', padding: 0, cursor:'pointer',
            width: 60, height: 60, display:'flex', alignItems:'center', justifyContent:'center',
            color: TC.green,

            {I.plus}
          </button>

      )}

  return (
    <div style={{
      position: sticky ? 'sticky' : 'static', top: 0, zIndex: 10,
      paddingTop: 56, paddingBottom: 12, paddingLeft: 16, paddingRight: 16,
      background: accent || 'linear-gradient(180deg, rgba(239,235,226,0.95) 0%, rgba(239,235,226,0.6) 70%, rgba(239,235,226,0) 100%)',

      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom: 6, minHeight: 36 }}>
        {onBack ? (
          <Glass radius={999} style={{ }}>
            <button onClick={onBack} style={{
              background:'none', border:'none', cursor:'pointer',
              width: 36, height: 36, display:'flex', alignItems:'center', justifyContent:'center',
              color: TC.ink, padding: 0,
            }}>{I.back}</button>

// ──────────────────────────────────────────────────────────────
// Animated screen transition — push from right with spring
// ──────────────────────────────────────────────────────────────
function PushScreen({ children, k }) {
  return (
    <div key={k} style={{
      position:'absolute', inset: 0,
      animation: 'tcPush 380ms cubic-bezier(.32,.72,0,1) both',
    }}>{children}</div>
  );
}

// ──────────────────────────────────────────────────────────────
// Sheet — bottom-up modal
// ──────────────────────────────────────────────────────────────
function Sheet({ open, onClose, title, children, height = '78%' }) {
  if (!open) return null;
  return (
    <div style={{
      position:'absolute', inset: 0, zIndex: 100,
      animation: 'tcFade 200ms ease both',
    }}>
      <div onClick={onClose} style={{
        position:'absolute', inset: 0, background:'rgba(27,26,23,0.35)',
        backdropFilter:'blur(6px)', WebkitBackdropFilter:'blur(6px)',
      }} />
      <div style={{
        position:'absolute', bottom: 0, left: 0, right: 0, height,
        background: TC.bg2, borderRadius: '32px 32px 0 0',
        boxShadow: '0 -8px 40px rgba(0,0,0,0.18)',
        animation: 'tcUp 380ms cubic-bezier(.32,.72,0,1) both',
        display:'flex', flexDirection:'column', overflow:'hidden',
      }}>
        <div style={{ display:'flex', justifyContent:'center', paddingTop: 10, paddingBottom: 4 }}>
          <div style={{ width: 40, height: 4, borderRadius: 4, background: 'rgba(27,26,23,0.18)' }} />
        </div>
        {title && (
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding: '8px 18px 14px' }}>
            <div style={{ fontSize: 18, fontWeight: 700, color: TC.ink }}>{title}</div>

              background: 'rgba(27,26,23,0.07)', border:'none', borderRadius: 999,
              width: 30, height: 30, fontSize: 16, color: TC.muted, cursor:'pointer', fontWeight: 700,
            }}>✕</button>
          </div>
        )}
        <div style={{ flex: 1, overflow: 'auto', padding: '0 18px 24px' }}>{children}</div>
      </div>
    </div>
  );
}
window.Sheet = Sheet;

function Toast({ msg }) {
  if (!msg) return null;
  return (
    <div style={{
      position:'absolute', bottom: 110, left: '50%', transform: 'translateX(-50%)',
      zIndex: 200, pointerEvents:'none',
      animation: 'tcUp 280ms cubic-bezier(.32,.72,0,1) both',

    </div>
  );

function Segmented({ options, value, onChange }) {

    <div style={{
      display:'inline-flex', padding: 3, borderRadius: 999,

            transition: 'background 180ms ease',

    </div>
  );
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  </script>

function darken(hex) {
  // hacky darken
  if (!hex.startsWith('#')) return hex;
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, ((n >> 16) & 0xff) - 50);
  const g = Math.max(0, ((n >> 8) & 0xff) - 50);
  const b = Math.max(0, (n & 0xff) - 50);
  return `rgb(${r},${g},${b})`;
}

        <div style={{ marginTop: 16, padding: 14, borderRadius: 16, background: window.TC.greenSoft, color: window.TC.greenDk, fontSize: 13, fontWeight: 600, textAlign:'center' }}>

        </div>
      )}
    </div>
  );
}

// Caption helpers — highlight banned words + show flags
const BANNED_WORDS = ['ดีที่สุด','อันดับ 1','อันดับหนึ่ง','รับประกัน','no.1'];
function CaptionWithFlags({ text, active }) {
  // Split text around banned words
  const pattern = new RegExp(`(${BANNED_WORDS.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
  const parts = text.split(pattern);
  return (
    <div style={{ fontSize: 12.5, color: window.TC.ink2, lineHeight: 1.6, marginBottom: 12 }}>
      "{parts.map((p, i) => {
        const banned = BANNED_WORDS.some(w => p.toLowerCase() === w.toLowerCase());
        if (banned) return <span key={i} style={{ background: window.TC.roseSoft, color:'#8C1F3A', padding:'1px 4px', borderRadius: 4, fontWeight: 700 }}>{p}</span>;
        return <span key={i}>{p}</span>;
      })}"
    </div>
  );
}
function CaptionFlags({ text, active }) {
  const bannedHits = BANNED_WORDS.filter(w => text.toLowerCase().includes(w.toLowerCase()));
  const hashtags = (text.match(/#\S+/g) || []).length;
  const limits = { Shopee: 4, 'TikTok Shop': 5, Lazada: 6, 'LINE Shop': 3, Facebook: 8 };
  const limit = limits[active] || 5;
  const len = text.length;
  return (
    <div style={{ display:'flex', gap: 8, flexWrap:'wrap' }}>
      {bannedHits.length > 0 ? (
        <span style={{ fontSize: 11, fontWeight: 700, color: window.TC.rose, background: window.TC.roseSoft, padding:'4px 10px', borderRadius: 999 }}>⚠︎ คำต้องห้าม {bannedHits.length}</span>
      ) : (
        <span style={{ fontSize: 11, fontWeight: 700, color: window.TC.green, background: window.TC.greenSoft, padding:'4px 10px', borderRadius: 999 }}>✓ ภาษาสะอาด</span>
      )}
      <span style={{ fontSize: 11, fontWeight: 700, color: window.TC.green, background: window.TC.greenSoft, padding:'4px 10px', borderRadius: 999 }}>✓ Tone of voice</span>
      {hashtags > limit ? (
        <span style={{ fontSize: 11, fontWeight: 700, color: '#7A5A12', background: window.TC.amberSoft, padding:'4px 10px', borderRadius: 999 }}>· hashtag {hashtags}/{limit}</span>
      ) : (
        <span style={{ fontSize: 11, fontWeight: 700, color: window.TC.green, background: window.TC.greenSoft, padding:'4px 10px', borderRadius: 999 }}>✓ hashtag {hashtags}</span>
      )}
      <span style={{ fontSize: 11, fontWeight: 700, color: window.TC.muted, background: window.TC.bg2, padding:'4px 10px', borderRadius: 999 }}>{len} ตัวอักษร</span>
    </div>
  );
}

const APPS_SCRIPT_TEMPLATE = `// TEAM Chardchakaj — Ops Backend
// Deploy: Extensions > Apps Script > Deploy > Web app
// Run as: Me  ·  Who has access: Anyone
const SHEET_ID = '1aB2c…XyZ';
const LINE_TOKEN = PropertiesService
  .getScriptProperties().getProperty('LINE_TOKEN');

function doGet(e) {
  const path = (e.parameter.path || '').split('/');
  const [_, kind] = path;       // e.g. 'tasks'
  const ss = SpreadsheetApp.openById(SHEET_ID);
  const tab = ss.getSheetByName(kind);
  if (!tab) return json({ error: 'tab not found' }, 404);
  const rows = tab.getDataRange().getValues();
  const [head, ...data] = rows;
  const out = data.map(r =>
    Object.fromEntries(head.map((h, i) => [h, r[i]]))
  );
  return json(out);
}

function doPost(e) {
  const body = JSON.parse(e.postData.contents);
  const path = (e.parameter.path || '').split('/');
  const [_, kind, id, action] = path;
  const ss = SpreadsheetApp.openById(SHEET_ID);
  const tab = ss.getSheetByName(kind);

  if (kind === 'approvals' && action === 'decide') {
    return decideApproval(tab, id, body);
  }
  if (kind === 'notify') return notifyLine(body);

  // upsert by id
  const data = tab.getDataRange().getValues();
  const head = data[0];
  const idCol = head.indexOf('id');
  const rowIx = data.findIndex((r, i) =>
    i > 0 && String(r[idCol]) === String(body.id));
  const row = head.map(h => body[h] ?? '');
  if (rowIx === -1) tab.appendRow(row);
  else tab.getRange(rowIx + 1, 1, 1, row.length).setValues([row]);

  if (kind === 'tasks') notifyLine({
    to: lookupUser(body.owner).lineId,
    text: 'มี task ใหม่: ' + body.title,
  });
  return json({ ok: true, id: body.id });
}

function decideApproval(tab, id, body) {
  const data = tab.getDataRange().getValues();
  const ix = data.findIndex((r, i) => i > 0 && r[0] === id);
  tab.getRange(ix + 1, 5).setValue(body.decision);
  tab.getRange(ix + 1, 6).setValue(new Date());
  notifyLine({
    to: lookupUser(data[ix][2]).lineId,
    text: body.decision === 'approve'
      ? '✓ Approved: ' + data[ix][1]
      : '⚠ ขอแก้ไข: ' + data[ix][1],
  });
  return json({ ok: true });
}

function notifyLine({ to, text }) {
  UrlFetchApp.fetch('https://api.line.me/v2/bot/message/push', {
    method: 'post',
    contentType: 'application/json',
    headers: { Authorization: 'Bearer ' + LINE_TOKEN },
    payload: JSON.stringify({
      to, messages: [{ type: 'text', text }],
    }),
  });
  return json({ ok: true });
}

function lookupUser(uid) {
  const tab = SpreadsheetApp.openById(SHEET_ID)
    .getSheetByName('team');
  const rows = tab.getDataRange().getValues();
  const [h, ...d] = rows;
  const idIx = h.indexOf('id');
  return d.map(r => Object.fromEntries(
    h.map((k, i) => [k, r[i]])
  )).find(u => u.id === uid);
}

function json(obj, code) {
  return ContentService
    .createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}`;

    if (['home','projects','inbox','tools'].includes(screen)) setTab(screen);
  };
  const back = () => setStack(prev => prev.length > 1 ? prev.slice(0, -1) : prev);
  const changeTab = (k) => {
    if (k === 'inbox') { go('approval'); setTab('inbox'); return; }
    setStack([{ s: k }]); setTab(k);
  };

  // Render screen by name
  const renderScreen = (s) => {
    const props = { go, back, role, toast, openAdd, openTask, onNotif: () => setOpenNotif(true), onSearch: () => setOpenSearch(true) };
    switch (s.s) {
      case 'home':       return <window.ScreenHome {...props} />;
      case 'projects':   return <window.ScreenProjects {...props} />;
      case 'project':    return <window.ScreenProject {...props} pid={s.id} />;
      case 'kanban':     return <window.ScreenKanban {...props} />;
      case 'tools':      return <window.ScreenTools {...props} />;
      case 'equipment':  return <window.ScreenEquipment {...props} />;
      case 'filename':   return <window.ScreenFileName {...props} />;
      case 'approval':   return <window.ScreenApproval {...props} />;
      case 'prepost':    return <window.ScreenPrePost {...props} />;
      case 'integrations': return <window.ScreenIntegrations {...props} />;
      case 'team':       return <window.ScreenTeam {...props} />;
      default:           return <window.ScreenHome {...props} />;
    }
  };

  return (
    <window.DensityCtx.Provider value={t.density}>
      <div style={{
        minHeight: '100vh', display:'flex', alignItems:'center', justifyContent:'center',
        background: 'radial-gradient(80% 60% at 50% 10%, #F4EFE4 0%, #E8DDC8 60%, #D7C9AE 100%)',
        padding: 24, boxSizing:'border-box',
      }}>
        <PhoneFrame show={t.showFrame}>
          {/* Animated screen stack — only show top */}
          <div style={{ position:'absolute', inset: 0, overflow:'hidden' }}>
            <div className="tc-scroll" style={{
              position:'absolute', inset: 0, overflowY: 'auto', overflowX: 'hidden',
              background: window.TC.bg,
            }}
              key={stack.length + '-' + top.s}
              data-screen-label={top.s}
            >
              <div style={{ animation: stack.length > 1 ? 'tcPush 380ms cubic-bezier(.32,.72,0,1) both' : 'tcFade 220ms ease both' }}>
                {renderScreen(top)}
              </div>
            </div>

            {/* Bottom tab bar — present on root screens (and approval which is the Inbox root) */}
            {(['home','projects','tools'].includes(top.s) || (top.s === 'approval' && stack.length === 1)) && (
              <window.TabBar active={tab} onChange={changeTab} onAdd={() => openAdd('menu')} role={role} />
            )}

            <window.QuickAddSheet
              open={addSheet}
              onClose={() => setAddSheet(false)}
              role={role}
              toast={toast}
              go={go}
              initial={addInitial}
            />

            <window.NotificationsSheet open={openNotif} onClose={() => setOpenNotif(false)} role={role} go={go} toast={toast} />
            <window.SearchSheet open={openSearch} onClose={() => setOpenSearch(false)} go={go} />
            <window.TaskDetailSheet open={!!taskSheet} task={taskSheet} onClose={() => setTaskSheet(null)} role={role} toast={toast} />

            <window.Toast msg={toastMsg} />
          </div>
        </PhoneFrame>

        {/* Tweaks panel */}
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection label="View as" />
          <window.TweakSelect
            label="Role"
            value={t.role}
            options={window.APP_DATA.team.map(u => ({ value: u.id, label: `${u.name} — ${u.role}` }))}
            onChange={(v) => setTweak('role', v)}
          />
          <window.TweakSection label="Layout" />
          <window.TweakRadio label="Density" value={t.density}
                             options={['compact','comfy']}
                             onChange={(v) => setTweak('density', v)} />
          <window.TweakToggle label="Phone frame" value={t.showFrame}
                              onChange={(v) => setTweak('showFrame', v)} />
        </window.TweaksPanel>
      </div>
    </window.DensityCtx.Provider>
  );
}

// Wait for LIFF init + initial Sheets sync (no-op when not configured), then mount.
(window.BACKEND ? window.BACKEND.bootstrap() : Promise.resolve())
  .catch(err => { console.warn('[TC] backend bootstrap failed, mounting with seed data:', err); })
  .finally(() => { ReactDOM.createRoot(document.getElementById('root')).render(<App />); });

  </script>
</body>
</html>
